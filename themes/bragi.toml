# Bragi theme: the palette of Bragi, a Weird Brains (https://weirdbrains.com) terminal app.
# Sets the optional roles too (surface, code_bg, link, dim, diff_add_bg, diff_remove_bg); other
# themes get those derived from their required roles. `raised` and `shadow` are extra palette
# entries an app may read by name.
[meta]
name = "bragi"
display_name = "Bragi"
author = "Weird Brains LLC"
base = "Bragi brand"

[dark]
variant_name = "Bragi Dark (Rune Ink)"
bg = "rune_ink"
fg = "text"
muted = "text_secondary"
border = "border"
border_focus = "mead_gold"
selection_bg = "selection"
selection_fg = "honey"
accent = "mead_gold"
header = "honey"
up = "green"
down = "red"
warning = "amber"
error = "red"
success = "green"
info = "glacier"
chart_1 = "mead_gold"
chart_2 = "glacier"
chart_3 = "green"
chart_4 = "amber"
chart_5 = "honey"
chart_6 = "red"
surface = "surface"
code_bg = "code_bg"
link = "link"
dim = "dim"
diff_add_bg = "diff_add_bg"
diff_remove_bg = "diff_remove_bg"

[dark.palette]
rune_ink = "#14161b"
surface = "#1c1f26"
raised = "#2a2e37"
code_bg = "#1c1f26"
border = "#3a3f4b"
text = "#f4f1e8"
text_secondary = "#a9abb3"
dim = "#6c707b"
mead_gold = "#f5b83d"
honey = "#ffe2a0"
selection = "#5a4518"
glacier = "#7fd4f5"
link = "#7fd4f5"
green = "#4cd07d"
amber = "#ff9f43"
red = "#ff5c70"
diff_add_bg = "#173322"
diff_remove_bg = "#3d1a22"
shadow = "#0a0b0e"

[light]
variant_name = "Bragi Light (Parchment)"
bg = "parchment"
fg = "rune_ink"
muted = "text_secondary"
border = "border"
border_focus = "gold_dark"
selection_bg = "selection"
selection_fg = "rune_ink"
accent = "gold_dark"
header = "gold_deep"
up = "green"
down = "red"
warning = "amber"
error = "red"
success = "green"
info = "link"
chart_1 = "gold_dark"
chart_2 = "link"
chart_3 = "green"
chart_4 = "amber"
chart_5 = "gold_deep"
chart_6 = "red"
surface = "surface"
code_bg = "code_bg"
link = "link"
dim = "dim"
diff_add_bg = "diff_add_bg"
diff_remove_bg = "diff_remove_bg"

[light.palette]
parchment = "#fff6df"
surface = "#ffffff"
raised = "#f6ead0"
code_bg = "#fbf1dc"
border = "#e0d2b0"
rune_ink = "#14161b"
text_secondary = "#55585f"
dim = "#8a8c93"
gold_dark = "#b7791a"
gold_deep = "#7a4f0c"
selection = "#f5dfa8"
link = "#0e3b5c"
green = "#1d7a45"
amber = "#a85400"
red = "#c42a40"
diff_add_bg = "#dff3e4"
diff_remove_bg = "#fbe1e4"
shadow = "#d9ccaa"
