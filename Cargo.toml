[package]
name = "weirdnet-themes"
# Its own SemVer, independent of the workspace version.
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet themes: a TOML theme format with dark and light variants, semantic colour roles with derived optional roles, built-in palettes, contrast checks, NO_COLOR, per-user theme editing helpers and optional ratatui colours."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-themes"
documentation = "https://docs.rs/weirdnet-themes"
readme = "README.md"
keywords = ["theme", "colors", "toml", "terminal", "ratatui"]
categories = ["gui", "command-line-interface"]
include = ["src/**", "themes/*.toml", "README.md", "LICENSE"]

[features]
default = []
# Lets `detect::Probe::terminal` ask the terminal for its background (OSC 11). Off by default,
# and even when on, only `resolve_variant_with` / `detect::system_variant` with that probe query.
terminal-background = ["dep:terminal-light"]
# Resolve variants to ratatui colours by terminal colour depth.
ratatui = ["dep:ratatui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
dirs = "6"
terminal-light = { version = "1", optional = true }
ratatui = { version = "0.30", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
